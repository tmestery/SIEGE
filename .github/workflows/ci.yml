name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests

  nightly-eval:
    name: Nightly fixed evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      SEIGE_CI_MODELS: ${{ vars.SEIGE_CI_MODELS || 'local/refusing,local/leaking' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      HUGGINGFACE_BASE_URL: ${{ vars.HUGGINGFACE_BASE_URL || 'https://api-inference.huggingface.co/models' }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://localhost:11434' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run fixed SEIGE evaluation suite
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m siege.ci_eval \
            --models "$SEIGE_CI_MODELS" \
            --output-dir artifacts/nightly-eval

      - name: Validate report JSON artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          report_paths = sorted(Path("artifacts/nightly-eval").glob("*.json"))
          if not report_paths:
              raise SystemExit("No evaluation report artifacts were generated.")
          for path in report_paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: seige-nightly-eval-reports
          path: artifacts/nightly-eval/*.json
          if-no-files-found: error
